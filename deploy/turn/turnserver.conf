# ============================================================
# coturn 配置模板（部署前必须修改）
# 复制本文件为 turnserver.conf 并按注释替换占位值
# 部署文档见同目录 README.md；对应前端 ICE 配置见 README 第 4 节
# ============================================================

# 监听端口（UDP+TCP）
listening-port=3478

# 启用 fingerprint（WebRTC 需要）
fingerprint

# 中继端口范围（min-max），默认 49152-65535；做大并发可分段
min-port=49152
max-port=65535

# TLS 监听端口（可选，未配证书时注释）
# listening-port=5349
# cert=/etc/coturn/certs/cert.pem
# pkey=/etc/coturn/certs/key.pem

# ---- 认证：使用 TURN REST API 方案（推荐，动态下发临时凭据）----
# 长期共享密钥，必须替换（生成：openssl rand -base64 32）
use-auth-secret
static-auth-secret=REPLACE_WITH_OPENSSL_RAND_BASE64_32

# realm 需与你的域名一致（浏览器会用域名校验收据）
realm=REPLACE_WITH_YOUR_DOMAIN

# ---- 会话/配额 ----
# 单用户会话上限，防滥用
user-quota=12
# 全局用户上限
total-quota=1200
# 宽松时间窗口（NAT 后非对称时容忍时钟偏差）
stale-nonce=600

# ---- 安全 ----
# 禁止与多播地址通信
no-multicast-peers
# 拒绝私有 IP 对端（防止 TURN 被当跳板打内网），生产按需
# refused-private-peer-ip
# 日志级别
log-file=/var/log/turnserver.log
simple-log
# 后台运行
daemon