# 鏈嶅姟鍩虹閰嶇疆
server:
  port: ${SERVER_PORT:8080}
  error:
    whitelabel:
      enabled: false

# Spring 鏍稿績閰嶇疆
spring:
  application:
    name: backend
  # 鏁版嵁婧愰厤缃?
  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:yunyu_assistant}?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai&allowMultiQueries=true&rewriteBatchedStatements=true
    username: ${DB_USER:root}
    password: ${DB_PASSWORD:1234}
    driver-class-name: com.mysql.cj.jdbc.Driver
    # 杩炴帴姹犻厤缃紙Spring Boot3 榛樿 HikariCP锛屾樉寮忛厤缃紭鍖栨€ц兘锛?
    hikari:
      minimum-idle: 5
      maximum-pool-size: 20
      auto-commit: true
      idle-timeout: 300000
      connection-timeout: 10000
  # 鏁版嵁搴撳垵濮嬪寲鑴氭湰
  sql:
    init:
      mode: never
      schema-locations: classpath:index.sql
      # 鐢熶骇鐜寤鸿鍏抽棴锛屼粎寮€鍙戝惎鐢?
      continue-on-error: false
  # Spring AI 澶фā鍨嬮厤缃?
  ai:
    openai:
      api-key: ${OPENAI_API_KEY:sk-f59643b1f01d40d797d3741b733e15f5}
      base-url: ${OPENAI_BASE_URL:https://platform.deepseek.com/v1}
      chat:
        options:
          model: ${AI_MODEL:deepseek-chat}
          temperature: ${AI_TEMPERATURE:0.7}
          max-tokens: 2048

# MyBatis-Plus 閰嶇疆
mybatis-plus:
  # XML 鏄犲皠鏂囦欢浣嶇疆
  mapper-locations: classpath:mapper/*.xml
  type-aliases-package: com.leyon.backend.entity
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      # 涓婚敭绛栫暐锛欰SSIGN_ID锛堢敤鎴疯緭鍏ワ級
      id-type: assign_uuid
      # 閫昏緫鍒犻櫎瀛楁鍚?
      logic-delete-field: isDeleted
      # 閫昏緫鍒犻櫎鍊硷細0=鏈垹闄? 1=宸插垹闄?
      logic-not-delete-value: 0
      logic-delete-value: 1

# 鑷畾涔変笟鍔￠厤缃?
app:
  # JWT 璁よ瘉閰嶇疆
  jwt:
    secret: ${JWT_SECRET:yunyu-assistant-jwt-secret-key-2026-min-32-bytes!}
    expiration: ${JWT_EXPIRATION:86400000}
  # RAG 鐭ヨ瘑搴撴湇鍔?
  ragflow:
    api-key: ${RAGFLOW_API_KEY:ragflow-Q5MGZjODk0NzM3YzExZjA5ZDE0NDIwMT}
    endpoint: ${RAGFLOW_ENDPOINT:https://demo.ragflow.io}
  # 鍏ㄧ綉鎼滅储鏈嶅姟
  search:
    api-key: ${SEARCH_API_KEY:sk-cc311683639848cf881d1d5434e50592}
    endpoint: ${SEARCH_ENDPOINT:https://api.bochaai.com/v1/web-search}
  # 澶╂皵鎺ュ彛
  weather:
    api-key: ${WEATHER_API_KEY:344f2aacc73b0a22aca1c50cbe5d7652}
  # WebSocket 璇煶鏈嶅姟
  rustpbx:
    endpoint: ${RUSTPBX_ENDPOINT:ws://175.27.250.177:8080}
  # 璇煶璇嗗埆 ASR锛堣吘璁簯锛?
  asr:
    provider: ${ASR_PROVIDER:tencent}
    model: ${ASR_MODEL:16k_zh}
    app-id: ${ASR_APP_ID:[REDACTED]}
    secret-id: ${ASR_SECRET_ID:[REDACTED]}
    secret-key: ${ASR_SECRET_KEY:[REDACTED]}
    endpoint: ${ASR_ENDPOINT:asr.tencentcloudapi.com}

  # 璇煶鍚堟垚 TTS锛堣吘璁簯锛?
  tts:
    provider: ${TTS_PROVIDER:tencent}
    # 妯″瀷/闊宠壊閰嶇疆
    model: ${TTS_MODEL:cosvoice-v1}
    speaker: ${TTS_SPEAKER:longxiaochun}
    app-id: ${TTS_APP_ID:[REDACTED]}
    secret-id: ${TTS_SECRET_ID:[REDACTED]}
    secret-key: ${TTS_SECRET_KEY:[REDACTED]}
    endpoint: ${TTS_ENDPOINT:tts.tencentcloudapi.com}

# 鏃ュ織绾у埆锛堝紑鍙戠幆澧冭皟璇曪級
logging:
  level:
    root: INFO
    com:
      leyon:
        backend:
          mapper: DEBUG
    org:
      springframework:
        ai: INFO