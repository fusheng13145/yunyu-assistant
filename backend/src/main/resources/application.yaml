# 服务基础配置
server:
  port: ${SERVER_PORT:8080}
  error:
    whitelabel:
      enabled: false

# Spring 核心配置
spring:
  application:
    name: backend
  # Redis 连接（多实例共享状态用；app.redis.enabled=false 时不需要 Redis，自动配置惰性连接）
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
  servlet:
    # Multipart 上传限制：与前端单文件 50MB 上限对齐，避免大文件上传被默认 1MB 拒绝
    multipart:
      max-file-size: 50MB
      max-request-size: 60MB
  # 数据源配置（生产环境必须通过环境变量注入，禁止使用默认值）
  datasource:
      url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:yunyu_assistant}?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai&allowMultiQueries=true&rewriteBatchedStatements=true
      username: ${DB_USER}
      password: ${DB_PASSWORD}
      driver-class-name: com.mysql.cj.jdbc.Driver
      # 连接池配置（Spring Boot3 默认 HikariCP，显式配置优化性能）
      hikari:
        minimum-idle: 5
        maximum-pool-size: 20
        auto-commit: true
        idle-timeout: 300000
        connection-timeout: 10000
  # 数据库初始化脚本
  sql:
    init:
      mode: never
      schema-locations: classpath:index.sql
      # 生产环境建议关闭，仅开发启用
      continue-on-error: false
  # Spring AI 大模型配置（生产必须注入真实 API Key/Base URL；默认值为占位，保证无 Key 时系统仍可启动，LLM 调用将降级）
  ai:
    openai:
      api-key: ${OPENAI_API_KEY:dev-placeholder-llm-key}
      base-url: ${OPENAI_BASE_URL:https://api.openai.com/v1}
      chat:
        options:
          model: ${AI_MODEL:deepseek-chat}
          temperature: ${AI_TEMPERATURE:0.7}
          max-tokens: 2048

# MyBatis-Plus 配置
mybatis-plus:
  # XML 映射文件位置
  mapper-locations: classpath:mapper/*.xml
  type-aliases-package: com.leyon.backend.entity
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      # 主键策略：ASSIGN_ID（用户输入）
      id-type: assign_uuid
      # 逻辑删除字段名
      logic-delete-field: isDeleted
      # 逻辑删除值：0=未删除, 1=已删除
      logic-not-delete-value: 0
      logic-delete-value: 1

# 自定义业务配置（所有敏感值必须通过环境变量注入，禁止硬编码默认值）
app:
  # Redis 共享状态开关：true 时限流/令牌黑名单/登录锁定写入 Redis（多实例共享），false 时降级单实例内存实现
  redis:
    enabled: ${REDIS_ENABLED:false}
  # WebRTC ICE 服务器配置（JSON 数组，如 [{"urls":"turn:turn.example.com:3478","username":"u","credential":"p"}]）
  # 未配置时前端回退默认 Google STUN；生产建议配置 TURN 穿透对称 NAT（见手册 6.6）
  webrtc:
    ice-servers: ${WEBRTC_ICE_SERVERS:[]}
  # 通话录音存储目录（前端 MediaRecorder 录制上传，文件名 {callId}.webm）
  recording:
    dir: ${RECORDING_DIR:./data/recordings}
  # 数据归档（P2-9）：管理端手动触发 + 可选定时任务（默认关闭）
  archive:
    # 定时归档开关，默认关闭；开启后按 cron 自动执行（单实例调度，跨实例防重未做）
    schedule-enabled: ${ARCHIVE_SCHEDULE_ENABLED:false}
    # 每日凌晨 3 点执行
    cron: ${ARCHIVE_CRON:0 0 3 * * ?}
    # 每批次处理条数（含 TEXT/JSON 大字段，建议 200-500）
    batch-size: ${ARCHIVE_BATCH_SIZE:500}
    # 各表保留天数（超期即归档到 *_archive 并物理删除源表）
    records-retention-days: ${ARCHIVE_RECORDS_RETENTION_DAYS:180}
    call-records-retention-days: ${ARCHIVE_CALL_RECORDS_RETENTION_DAYS:180}
    audit-logs-retention-days: ${ARCHIVE_AUDIT_LOGS_RETENTION_DAYS:180}
    # 归档分布式锁 TTL（毫秒，v2.19 跨实例防重；同刻仅一个实例执行归档）
    lock-ttl-ms: ${APP_ARCHIVE_LOCK_TTL_MS:600000}
  # 用量配额（P2-10）：org/user 无配置记录时的默认上限（管理端可经 /api/admin/quotas 按作用域覆盖）
  quota:
    assistant-limit: ${APP_QUOTA_ASSISTANT_LIMIT:50}
    daily-call-limit: ${APP_QUOTA_DAILY_CALL:20}
    daily-call-sec-limit: ${APP_QUOTA_DAILY_CALL_SEC:3600}
    daily-msg-limit: ${APP_QUOTA_DAILY_MSG:500}
  # PSTN 外呼网关（P2-17）：可插拔 HTTP 网关，未配置 gateway-url 时外呼任务置 FAILED
  pstn:
    # 外呼网关地址（POST JSON {taskId, assistantId, phoneNumber, callbackUrl}），空=不启用
    gateway-url: ${PSTN_GATEWAY_URL:}
    # 本系统 PSTN 回调端点（供网关回调，默认相对路径占位）
    callback-url: ${PSTN_CALLBACK_URL:}
    # PSTN 网关回调鉴权 Token（/api/open/callbacks/pstn 校验 X-Gateway-Token）
    callback-token: ${PSTN_CALLBACK_TOKEN:}
    # DIALING 滞留超时阈值（毫秒，v2.18）：超过即由超时扫描置 FAILED「呼叫超时未接通」
    timeout-ms: ${PSTN_TIMEOUT_MS:120000}
    # 外呼超时扫描周期（毫秒，v2.18）
    scan-interval-ms: ${PSTN_SCAN_INTERVAL_MS:30000}
  # Webhook 回调（P2-17）：事件投递到第三方应用配置的 webhook_url，异步 + 失败重试（指数退避）
  webhook:
    # 全局开关
    enabled: ${WEBHOOK_ENABLED:true}
    # 失败重试最大次数
    retry-max-attempts: 3
    # 重试基础延迟（毫秒），指数退避 baseDelay * 2^(attempt-1)
    retry-base-delay-ms: 5000
    # 失败重试定时扫描周期（毫秒）
    retry-interval-ms: 60000
  # JWT 认证配置（Secret 长度必须 ≥ 256 位 / 32 字节，生产环境使用强随机生成值）
  jwt:
    secret: ${JWT_SECRET}
    expiration: ${JWT_EXPIRATION:86400000}
    # 刷新令牌有效期（毫秒），默认 7 天
    refresh-expiration: ${JWT_REFRESH_EXPIRATION:604800000}
  # RAG 知识库服务（未配置时允许启动，检索功能降级）
  ragflow:
    api-key: ${RAGFLOW_API_KEY:}
    endpoint: ${RAGFLOW_ENDPOINT:}
  # 全网搜索服务（未配置时工具调用降级）
  search:
    api-key: ${SEARCH_API_KEY:}
    endpoint: ${SEARCH_ENDPOINT:}
  # 天气接口（未配置时工具调用降级）
  weather:
    api-key: ${WEATHER_API_KEY:}
  # WebSocket 语音服务（未配置时语音功能降级）
  rustpbx:
    endpoint: ${RUSTPBX_ENDPOINT:}
    # 沉默追问超时（秒），30s 未说话自动追问
    silence-timeout: ${RUSTPBX_SILENCE_TIMEOUT:30}
    # 是否启用 VAD 打断 TTS
    break-on-vad: ${RUSTPBX_BREAK_ON_VAD:true}
  # 语音识别 ASR（腾讯云）
  asr:
    provider: ${ASR_PROVIDER:tencent}
    model: ${ASR_MODEL:16k_zh}
    app-id: ${ASR_APP_ID:}
    secret-id: ${ASR_SECRET_ID:}
    secret-key: ${ASR_SECRET_KEY:}
    endpoint: ${ASR_ENDPOINT:asr.tencentcloudapi.com}

  # 语音合成 TTS（腾讯云）
  tts:
    provider: ${TTS_PROVIDER:tencent}
    # 模型/音色配置
    model: ${TTS_MODEL:cosvoice-v1}
    speaker: ${TTS_SPEAKER:longxiaochun}
    app-id: ${TTS_APP_ID:}
    secret-id: ${TTS_SECRET_ID:}
    secret-key: ${TTS_SECRET_KEY:}
    endpoint: ${TTS_ENDPOINT:tts.tencentcloudapi.com}

# Actuator 健康检查与运行指标（F9.4）
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always

# 日志级别（开发环境调试）
logging:
  level:
    root: INFO
    com:
      leyon:
        backend:
          mapper: DEBUG
    org:
      springframework:
        ai: INFO