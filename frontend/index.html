<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <!-- 浏览器地址栏主题色（白色简约） -->
  <meta name="theme-color" content="#ffffff">
  <!-- 兼容旧浏览器 -->
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <!-- 基础SEO -->
  <meta name="description" content="云谕助手 - 智能助手应用">
  <!-- 安全策略头 -->
  <!-- CSP（v2.76 收紧）：字体已自托管，Google Fonts 白名单撤除；模型/RAGFlow 一律走后端代理，浏览器不直连，connect-src 相应收窄 -->
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; font-src 'self'; connect-src 'self' ws: wss:; img-src 'self' data: blob:;">
  <meta http-equiv="X-Content-Type-Options" content="nosniff">
  <meta name="referrer-policy" content="strict-origin-when-cross-origin">
  <title>云谕助手</title>

</head>
<body class="m-0 p-0 bg-white text-gray-800 overflow-x-hidden">
  <div id="app" class="min-h-screen"></div>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
