name: CI

# PR 关键路径只放无凭据、无外部依赖的检查：后端单测（已验证不需要可达的 MySQL）、
# 前端 lint/type-check/构建、文档与配置门禁、冒烟脚本语法检查。
# 需要真实 key 或数据库的验证（scripts/smoke.sh 全链路）刻意不放在这里，见手册 4.8。

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: 后端单测（无数据库、无仓库密钥）
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      # 这四项在 application.yaml 里没有默认值，缺任一项 Spring 上下文就起不来；
      # 但单测不连库、不发真实请求，所以 CI 自备占位值，不配仓库 Secrets 也能跑通。
      DB_USER: ci
      DB_PASSWORD: ci-placeholder-unused
      OPENAI_API_KEY: ci-dummy-key-not-used
    steps:
      - uses: actions/checkout@v4
      - name: 安装 JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: 生成一次性 JWT 密钥（仅本次运行有效，不落库不外发）
        run: printf 'JWT_SECRET=%s\n' "$(openssl rand -hex 32)" >> "$GITHUB_ENV"
      - name: 运行测试
        run: ./mvnw -B test
      - name: 失败时保留 surefire 报告
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: backend/target/surefire-reports
          retention-days: 7

  frontend:
    name: 前端 lint / 类型 / 构建
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - name: 安装 Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: 安装依赖
        run: npm ci
      - name: ESLint
        run: npm run lint
      - name: 类型检查
        run: npm run type:check
      - name: 路由鉴权覆盖检查
        run: npm run check:auth
      - name: 生产构建
        run: npm run build

  gates:
    name: 门禁（文档 / 配置 / 脚本）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 安装 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: 文档结构门禁
        run: python scripts/check-docs.py
      - name: 配置项登记门禁
        run: python scripts/check-config.py
      - name: 冒烟脚本语法检查
        run: bash -n scripts/smoke.sh
