name: CI

# PR 关键路径只跑零凭据、零外部依赖的检查：后端单测（mapper 已打桩，不连真实 MySQL）、前端 lint/类型/构建与共8道桩测、文档与配置门禁。
# 需要真实 Key 或数据库的验证（scripts/smoke.sh 全链路、Playwright E2E）刻意不进此流水线，否则外部服务一抖 CI 就随机红，团队会开始忽略红叉。

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  # 最小权限：不给 GITHUB_TOKEN 写仓库的能力，防 PR 投毒 CI 脚本后越权。
  contents: read

concurrency:
  # 同一 ref 推新提交就取消旧的在跑任务：旧结果会被新的取代，留着只是浪费分钟。
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: 后端单测（无数据库、无仓库密钥）
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      # 这四项在 application.yaml 无默认值，缺了 Spring 上下文直接起不来；单测已打桩不真连库、不真调模型，给占位值过启动守卫即可。
      DB_USER: ci
      DB_PASSWORD: ci-placeholder-unused
      OPENAI_API_KEY: ci-dummy-key-not-used
    steps:
      - uses: actions/checkout@v4
      - name: 安装 JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: 生成一次性 JWT 密钥
        # 不写死在 yml：写死就泄漏进 git 历史。每次运行现场随机，只活在本次环境。
        run: printf 'JWT_SECRET=%s\n' "$(openssl rand -hex 32)" >> "$GITHUB_ENV"
      - name: 运行测试
        run: ./mvnw -B test
      - name: 失败时归档 surefire 报告
        # 平时不占存储，挂了才留 7 天方便回溯失败用例。
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: backend/target/surefire-reports
          retention-days: 7

  frontend:
    name: 前端 lint / 类型 / 构建
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - name: 安装 Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: 安装依赖
        run: npm ci
      - name: ESLint
        run: npm run lint
      - name: 类型检查
        run: npm run type:check
      - name: 路由鉴权覆盖检查
        run: npm run check:auth
      # 纯 Node 桩测：直接 import 前端源码模块跑断言，锁那些"容易随包一起改坏、单测又覆盖不到"的行为（通知清定时器、WS 失败帧解冻输入框、历史映射带角标等）。
      - name: 前端回归桩测
        run: |
          npm run check:notification
          npm run check:kb-flag
          npm run check:history-record
          npm run check:chat-frame
          npm run check:recording-upload
          npm run check:denial-ledger
          npm run check:page-layout
          npm run check:registries
      - name: 生产构建
        run: npm run build

  gates:
    name: 文档 / 配置 / 脚本门禁
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 安装 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: 文档结构门禁
        run: python scripts/gates/check-docs.py
      - name: 配置项登记门禁
        run: python scripts/gates/check-config.py
      - name: 冒烟脚本语法检查
        run: bash -n scripts/smoke/smoke.sh
